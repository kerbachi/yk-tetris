<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <title>yk-minecraft — web voxel sandbox</title>
  </head>
  <body>
    <div id="viewport" aria-label="Minecraft world"></div>
    <div id="crosshair" aria-hidden="true"></div>

    <div id="hud-top">
      <a id="back-link" href="./index.html">← Tetris</a>
      <div class="chip"><span id="selected">Grass</span> · <span id="fps">0 FPS</span></div>
    </div>

    <div id="hotbar" role="toolbar" aria-label="Block hotbar"></div>

    <div id="overlay">
      <div class="overlay-card">
        <h1>yk-minecraft</h1>
        <p>A browser voxel sandbox — walk the hills, chop trees, and build.</p>
        <button id="play" type="button">Click to play</button>
        <div class="controls">
          <div><code>W A S D</code> move · <code>Space</code> jump · <code>Shift</code> sprint</div>
          <div><code>Mouse</code> look · <code>LMB</code> break · <code>RMB</code> place</div>
          <div><code>1</code>–<code>8</code> hotbar · <code>Esc</code> release mouse</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/minecraft/main.ts"></script>
  </body>
</html>
