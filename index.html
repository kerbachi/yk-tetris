<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <title>yk-minecraft</title>
  </head>
  <body>
    <div id="viewport" aria-label="Minecraft world"></div>
    <div id="crosshair" aria-hidden="true"></div>
    <div id="break-bar" class="hidden" aria-hidden="true">
      <div id="break-fill"></div>
    </div>
    <img id="held-item" class="hidden" alt="" width="96" height="96" />

    <div id="hud-top">
      <div class="chip"><span id="selected">Diamond Pickaxe</span> · <span id="fps">0 FPS</span></div>
    </div>

    <div id="hotbar" role="toolbar" aria-label="Item hotbar"></div>

    <div id="overlay">
      <div class="overlay-card">
        <h1>yk-minecraft</h1>
        <p>A browser voxel sandbox — mine with tools, chop trees, and build.</p>
        <button id="play" type="button">Click to play</button>
        <div class="controls">
          <div><code>W A S D</code> move · <code>Space</code> jump · <code>Shift</code> sprint</div>
          <div><code>Hold LMB</code> mine · <code>RMB</code> place blocks · scroll tools</div>
          <div><code>1</code>–<code>9</code> hotbar · <code>Esc</code> release mouse</div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/minecraft/main.ts"></script>
  </body>
</html>
