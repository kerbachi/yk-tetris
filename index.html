<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <title>yk-tetris</title>
  </head>
  <body>
    <div id="app">
      <h1>yk-tetris</h1>
      <div class="layout">
        <canvas id="board" width="300" height="600"></canvas>
        <aside class="panel">
          <div class="stat">
            <span class="label">Score</span>
            <span id="score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Lines</span>
            <span id="lines" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Level</span>
            <span id="level" class="value">1</span>
          </div>
          <div class="stat">
            <span class="label">Next</span>
            <canvas id="next" width="120" height="120"></canvas>
          </div>
          <div class="stat" id="difficulty-panel">
            <span class="label">Difficulty</span>
            <div id="difficulty" class="difficulty" role="group" aria-label="Select difficulty">
              <button type="button" data-difficulty="1" class="active">1</button>
              <button type="button" data-difficulty="2">2</button>
              <button type="button" data-difficulty="3">3</button>
              <button type="button" data-difficulty="4">4</button>
              <button type="button" data-difficulty="5">5</button>
            </div>
          </div>
          <button id="start">Start / Restart</button>
          <p id="status" class="status">Press Start</p>
          <ul class="help">
            <li>&larr; &rarr; : Move</li>
            <li>&uarr; : Rotate</li>
            <li>&darr; : Soft drop</li>
            <li>Space : Hard drop</li>
            <li>P : Pause</li>
          </ul>
        </aside>
      </div>
    </div>
    <div id="gameover-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
      <div class="modal-card">
        <h2 id="gameover-title">Game Over</h2>
        <div class="modal-stats">
          <div class="stat">
            <span class="label">Score</span>
            <span id="final-score" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Lines</span>
            <span id="final-lines" class="value">0</span>
          </div>
          <div class="stat">
            <span class="label">Level</span>
            <span id="final-level" class="value">1</span>
          </div>
        </div>
        <div class="stat modal-difficulty">
          <span class="label">Difficulty</span>
          <div id="difficulty-modal" class="difficulty" role="group" aria-label="Select difficulty">
            <button type="button" data-difficulty="1" class="active">1</button>
            <button type="button" data-difficulty="2">2</button>
            <button type="button" data-difficulty="3">3</button>
            <button type="button" data-difficulty="4">4</button>
            <button type="button" data-difficulty="5">5</button>
          </div>
        </div>
        <button id="play-again">Play Again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
